name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure environment
        env:
          DB_URL: ${{ steps.neon.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$DB_URL_POOLED"
          AUTH_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$AUTH_SECRET"
          {
            echo "DATABASE_URL=$DB_URL_POOLED"
            echo "DATABASE_URL_UNPOOLED=$DB_URL"
            echo "BETTER_AUTH_SECRET=$AUTH_SECRET"
            echo "BETTER_AUTH_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:db
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
